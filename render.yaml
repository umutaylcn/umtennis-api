services:
  - type: web
    name: umtennis-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_presentation_cache.py
    startCommand: uvicorn tennis_ai.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: LIVE_TENNIS_API_KEY
        sync: false
