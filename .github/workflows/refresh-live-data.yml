name: Hide completed published matches

on:
  schedule:
    - cron: "23 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atp-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check only currently published fixtures
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python scripts/check_completed_fixtures.py
      - name: Commit completed fixture IDs only
        run: |
          git config user.name "UMTennis data bot"
          git config user.email "216855458+umutaylcn@users.noreply.github.com"
          git add data/public/completed_fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Hide completed published ATP fixtures"
            git push
          fi
